query CartTransformRunInput {
  cart {
    lines {
      id
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      printName: attribute(key: "Print name") {
        value
      }
      printNumber: attribute(key: "Print number") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            printPrice: metafield(namespace: "kit_printer", key: "print_price") {
              value
            }
          }
        }
      }
    }
  }
}
